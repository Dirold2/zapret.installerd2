# Linux adaptation of selected strategies from Default v5 (CrazyMaxs).
# https://git3.zapret.moe/zapretdiscordyoutube/zapret2-youtube-discord
# tls_max uses the bundled Google ClientHello when the upstream blob is unavailable.
# This is not the complete Windows preset.
# this file is included from init scripts
# change values here

# can help in case /tmp has not enough space

# redefine user for zapret daemons. required on Keenetic

# override firewall type : iptables,nftables,ipfw
FWTYPE=nftables

# options for ipsets
SET_MAXELEM=1048576
IPSET_OPT="hashsize 262144 maxelem $SET_MAXELEM"

# options for ip2net. "-4" or "-6" auto added by ipset create script
IP2NET_OPT4="--prefix-length=20-30 --v4-threshold=3/4"
IP2NET_OPT6="--prefix-length=56-64 --v6-threshold=5"

# options for auto hostlist
AUTOHOSTLIST_RETRANS_THRESHOLD=3
AUTOHOSTLIST_FAIL_THRESHOLD=3
AUTOHOSTLIST_FAIL_TIME=60
AUTOHOSTLIST_DEBUGLOG=0

MDIG_THREADS=16
GZIP_LISTS=1

DESYNC_MARK=0x40000000
DESYNC_MARK_POSTNAT=0x20000000

TPWS2_SOCKS_ENABLE=0
TPPORT_SOCKS=1080

TPWS2_SOCKS_OPT="
--filter-tcp=80 --methodeol <HOSTLIST> --new
--filter-tcp=443 --split-tls=sni --disorder <HOSTLIST>
"

TPWS2_ENABLE=0
TPWS2_PORTS=80,443

TPWS2_OPT="
--filter-tcp=80 --methodeol <HOSTLIST> --new
--filter-tcp=443 --split-tls=sni --disorder <HOSTLIST>
"

NFQWS2_ENABLE=1

NFQWS2_PORTS_TCP=80,443,1080,2053,2083,2087,2096,8443,3074,3478-3497,5060-5062,9987
NFQWS2_PORTS_UDP=443,1194,1400,3478-3482,3484,3488,3489,3491-3493,3495-3497,8443,19294-19344,50000-50100

NFQWS2_TCP_PKT_OUT=$(($AUTOHOSTLIST_RETRANS_THRESHOLD))
NFQWS2_TCP_PKT_IN=3
NFQWS2_UDP_PKT_OUT=8
NFQWS2_UDP_PKT_IN=3

NFQWS2_OPT="
--lua-init=@/opt/zapret2/lua/zapret-installer-multishake.lua \
--blob=tls_google:@/opt/zapret2/files/fake/tls_clienthello_www_google_com.bin \
--blob=tls_max:@/opt/zapret2/files/fake/tls_clienthello_www_google_com.bin \

--name=Discord-Gateway \
--filter-tcp=443 \
--hostlist-domains=gateway.discord.gg \
--payload=tls_client_hello --out-range=-d2 \
--lua-desync=hostfakesplit_multi:hosts=google.com,vimeo.com:tcp_ts=-1000:tcp_md5:repeats=2 \
--new

--name=Discord \
--filter-tcp=80,443,1080,2053,2083,2087,2096,8443 \
--hostlist-domains=discord.com,dis.gd,disboard.org,discord.center,discord.co,discord.design,discord.dev,discord.gift,discord.gifts,discord.me,discord.gg,discordapp.com,discordapp.net,discordapp.io,discord.new,discord.st,discord.store,discord.tools,discordactivities.com,discord-activities.com,discordbee.com,discordbotlist.com,discordcdn.com,discordexpert.com,discordhome.com,discordhub.com,discordinvites.net,discordlist.me,discordlist.space,discordmerch.com,discordpartygames.com,discords.com,discordsays.com,discordservers.com,discordstatus.com,discordtop.com,disforge.com,dyno.gg,findadiscord.com,mee6.xyz,top.gg,discord-attachments-uploads-prd.storage.googleapis.com,cloudflare-ech.com \
--payload=tls_client_hello --lua-desync=fakedsplit:pos=sniext+4:tcp_md5:repeats=1 --payload=empty --out-range=<s1 --lua-desync=send:tcp_md5 \
--new

--name=Discord_Media \
--filter-tcp=80,443,1080,2053,2083,2087,2096,8443 \
--hostlist-domains=discord.media \
--out-range=-d10 \
--lua-desync=send:repeats=3 \
--lua-desync=syndata:blob=tls_google \
--ipcache-hostname \
--lua-desync=syndata \
--new

--name=Discord_Voice \
--filter-udp=19294-19344,50000-50100 \
--filter-l7=stun,discord \
--out-range=-n8 \
--payload=stun,discord_ip_discovery \
--lua-desync=fake:blob=0x00 \
--new

--name=Discord_UDP \
--filter-udp=443-65535 \
--ipset-ip=95.101.173.0/24,162.159.129.0/24,162.159.137.0/24,84.17.42.0/24,109.252.188.0/24,5.200.0.0/16,18.165.0.0/16,23.227.0.0/16,34.0.0.0/16,34.1.0.0/16,34.125.0.0/16,34.126.0.0/16,34.127.0.0/16,34.128.0.0/16,35.186.0.0/16,35.207.0.0/16,35.208.0.0/16,35.209.0.0/16,35.210.0.0/16,35.211.0.0/16,35.212.0.0/16,35.213.0.0/16,35.214.0.0/16,35.207.0.0/16,35.208.0.0/16,35.209.0.0/16,35.210.0.0/16,35.211.0.0/16,35.212.0.0/16,35.213.0.0/16,35.214.0.0/16,35.215.0.0/16,35.216.0.0/16,35.217.0.0/16,35.218.0.0/16,35.219.0.0/16,66.22.0.0/16,64.233.0.0/16,74.125.0.0/16,104.17.0.0/16,104.18.0.0/16,104.21.0.0/16,104.22.0.0/16,104.23.0.0/16,104.24.0.0/16,104.25.0.0/16,108.177.0.0/16,138.128.0.0/16,138.199.0.0/16,142.250.0.0/16,142.251.0.0/16,142.252.0.0/16,149.152.0.0/16,149.153.0.0/16,162.157.0.0/16,162.160.0.0/16,172.65.0.0/16,172.66.0.0/16,172.67.0.0/16,173.194.0.0/16,188.114.0.0/16,204.11.0.0/16,209.85.0.0/16,2606:4700:4700::/48 \
--out-range=-n8 \
--payload=all \
--lua-desync=udplen:increment=5:pattern=0xDEADBEEF \
--new

--name=YouTube-Googlevideo \
--filter-tcp=80,443 \
--hostlist-domains=googlevideo.com \
--out-range=-d8 \
--lua-desync=multisplit:pos=sniext+1,midsld:seqovl=652 \
--new

--name=YouTube \
--filter-tcp=80,443 \
--hostlist-domains=jnn-pa.googleapis.com,youtubeembeddedplayer.googleapis.com,stable.dl2.discordapp.net,youtubei.googleapis.com,youtubekids.com,youtube.googleapis.com,google.ru,youtu.be,youtube.com,play.google.com,yt-video-upload.l.google.com,yt3.googleusercontent.com,youtube-ui.l.google.com,wide-youtube.l.google.com,ytimg.com,i.ytimg.com,yt3.ggpht.com,yt4.ggpht.com,youtube-nocookie.com,ytimg.l.google.com,googlevideo.com \
--lua-init=fake_default_tls=tls_mod(fake_default_tls,'rnd') \
--payload=tls_client_hello \
--lua-desync=multisplit:pos=10,midsld:seqovl=#fake_default_tls:seqovl_pattern=fake_default_tls \
--new
"

MODE_FILTER=autohostlist
FLOWOFFLOAD=software
INIT_APPLY_FW=1
DISABLE_IPV6=0
